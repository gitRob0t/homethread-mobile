name: Coho internal iOS

on:
  push:
    branches:
      - agent/chat-keyboard-homebot
    paths:
      - .eas/workflows/internal-ios.yml
      - App.tsx
      - index.ts
      - src/**
      - assets/**
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - tsconfig.json

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios:
    name: Build signed Coho internal beta
    type: build
    params:
      platform: ios
      profile: internal
